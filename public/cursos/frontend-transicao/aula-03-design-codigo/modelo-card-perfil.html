<!DOCTYPE html>
<!--
  ============================================================
  AQUECIMENTO — Card de perfil · Aula 03 · NickDev
  ------------------------------------------------------------
  O exemplo mais simples de "design → código": um card de perfil,
  só HTML + CSS (e um botão Seguir com JS).

  Responsivo: no computador fica centralizado com largura fixa;
  no celular ele preenche a tela e a galeria vira 1 coluna.

  É o aquecimento antes do portfólio. Cada parte comentada.
  ============================================================
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card de perfil · Aquecimento</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ---------- TOKENS ---------- */
    :root {
      --rosa: #F24487;
      --roxo: #7B4FD0;
      --grad: linear-gradient(120deg, #F24487, #7B4FD0);
      --fundo: #EEF0F6;
      --card: #FFFFFF;
      --texto: #1B1830;
      --suave: #6B6580;
      --linha: #ECEAF2;
      --raio: 22px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* body centraliza o card (Flexbox) */
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* O CARD: largura máxima no web, mas ocupa 100% no celular */
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: var(--raio);
      box-shadow: 0 24px 60px -24px rgba(74, 40, 120, .45);
      overflow: hidden;
    }

    .banner { height: 96px; background: var(--grad); }

    /* topo: avatar puxado pra cima do banner */
    .topo { text-align: center; padding: 0 26px; margin-top: -46px; }
    .avatar {
      width: 92px; height: 92px; border-radius: 50%;
      border: 4px solid var(--card);
      background: var(--grad);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 44px; font-weight: 700; margin: 0 auto;
    }
    .nome { font-size: 22px; font-weight: 600; margin-top: 12px; }
    .handle { color: var(--suave); font-size: 14px; }
    .bio { color: var(--suave); font-size: 14px; margin-top: 12px; line-height: 1.5; }

    /* stats: Grid de 3 colunas */
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      text-align: center; margin: 22px 26px; padding: 16px 0;
      border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha);
    }
    .stats .num { font-weight: 600; font-size: 18px; }
    .stats .lbl { color: var(--suave); font-size: 12px; }

    /* botão Seguir */
    .acoes { padding: 0 26px; }
    .btn-seguir {
      width: 100%; font: inherit; font-weight: 600; color: #fff;
      background: var(--grad); border: 0; padding: 13px; border-radius: 100px;
      cursor: pointer; transition: transform .15s;
    }
    .btn-seguir:hover { transform: translateY(-2px); }
    /* estado "seguindo": vira contornado */
    .btn-seguir.seguindo { background: #fff; color: var(--roxo); border: 1px solid var(--roxo); }

    /* galeria: Grid 2 colunas */
    .galeria-titulo { font-size: 13px; font-weight: 600; color: var(--suave); margin: 24px 26px 10px; }
    .galeria {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 26px;
    }
    .galeria div { height: 74px; border-radius: 12px; }
    .g1 { background: #FBD3E4; } .g2 { background: #D9CCF3; }
    .g3 { background: #FCE1CC; } .g4 { background: #CDEBDD; }

    /* tags: Flexbox que quebra linha */
    .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 26px 28px; }
    .tags span {
      font-size: 12px; color: var(--roxo); background: #F3EEFC;
      padding: 6px 12px; border-radius: 100px;
    }

    /* ---------- RESPONSIVO ---------- */
    @media (max-width: 380px) {
      /* em telas bem pequenas, a galeria vira 1 coluna */
      .galeria { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="banner"></div>

    <div class="topo">
      <div class="avatar">N</div>
      <div class="nome">Nicoly Almeida</div>
      <div class="handle">@nickdeve</div>
      <p class="bio">Desenvolvedora & professora. Transformo design em código com muita cor. 💜</p>
    </div>

    <div class="stats">
      <div><div class="num">32</div><div class="lbl">Projetos</div></div>
      <div><div class="num">1.2k</div><div class="lbl">Seguidores</div></div>
      <div><div class="num">890</div><div class="lbl">Curtidas</div></div>
    </div>

    <div class="acoes">
      <button class="btn-seguir" id="seguir">Seguir</button>
    </div>

    <div class="galeria-titulo">Meus projetos</div>
    <div class="galeria">
      <div class="g1"></div><div class="g2"></div>
      <div class="g3"></div><div class="g4"></div>
    </div>

    <div class="tags">
      <span>#dev</span><span>#design</span><span>#café</span><span>#frontend</span>
    </div>
  </div>

  <!-- Única interação: o botão Seguir troca de estado ao clicar -->
  <script>
    const botao = document.querySelector("#seguir");
    botao.addEventListener("click", () => {
      botao.classList.toggle("seguindo");
      botao.textContent = botao.classList.contains("seguindo") ? "Seguindo ✓" : "Seguir";
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<!--
  ============================================================
  MODELO DE RESPOSTA — Desafio 2 (Portfólio) · com BOOTSTRAP · NickDev
  ------------------------------------------------------------
  Mesmo portfólio interativo, agora usando a biblioteca BOOTSTRAP 5
  pra ganhar layout e componentes prontos (navbar, grid, cards,
  botões) — e só um CSS "de marca" por cima pro visual da NickDev.

  A componentização continua: os cards são gerados por uma FUNÇÃO
  a partir de uma lista de dados. O Bootstrap dá a APARÊNCIA;
  a função dá o REÚSO da estrutura.

  Interações (JS da aula 2): tema, filtros, curtir, carregar mais.
  ============================================================
-->
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portfólio · Bootstrap</title>

  <!-- 1) Bootstrap (a biblioteca) via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2) fonte + nosso CSS de marca -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Só o "tempero" da marca. O resto vem do Bootstrap. */
    :root { --rosa:#F24487; --roxo:#7B4FD0; --grad:linear-gradient(100deg,#F24487,#7B4FD0); }
    body { font-family:'Poppins', system-ui, sans-serif; }

    .logo { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .avatar {
      width:56px; height:56px; border-radius:50%; background:var(--grad);
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:24px; flex-shrink:0;
    }
    /* botões e badge com a cor da marca (por cima do Bootstrap) */
    .btn-grad { background:var(--grad); color:#fff; border:0; }
    .btn-grad:hover { color:#fff; filter:brightness(1.05); }
    .filtro.active { background:var(--grad); color:#fff; border-color:transparent; }
    .tag-badge { background:rgba(123,79,208,.14); color:var(--roxo); font-weight:500; }
    .cover { height:88px; border-radius:.6rem .6rem 0 0; }
    .curtir.liked { color:var(--rosa); border-color:var(--rosa); }
    .card { transition:transform .18s, box-shadow .25s; }
    .card:hover { transform:translateY(-4px); }
  </style>
</head>

<body>

  <!-- NAVBAR (componente do Bootstrap) -->
  <nav class="navbar navbar-expand bg-body border-bottom sticky-top">
    <div class="container">
      <span class="navbar-brand fw-bold logo">NickDev</span>
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link d-none d-sm-inline" href="#">Projetos</a>
        <a class="nav-link d-none d-sm-inline" href="#">Sobre</a>
        <button id="tema" class="btn btn-sm btn-outline-secondary rounded-circle" title="Trocar tema">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <!-- PERFIL (utilitários de flex do Bootstrap) -->
    <header class="d-flex align-items-center gap-3 mb-4">
      <div class="avatar">N</div>
      <div>
        <h1 class="h4 mb-0">Nicoly Almeida</h1>
        <p class="text-body-secondary mb-0">Desenvolvedora &amp; professora · meus projetos 👇</p>
      </div>
    </header>

    <!-- FILTROS -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="filtro btn btn-sm btn-outline-secondary rounded-pill active" data-cat="Todos">Todos</button>
      <button class="filtro btn btn-sm btn-outline-secondary rounded-pill" data-cat="Web">Web</button>
      <button class="filtro btn btn-sm btn-outline-secondary rounded-pill" data-cat="Mobile">Mobile</button>
      <button class="filtro btn btn-sm btn-outline-secondary rounded-pill" data-cat="Design">Design</button>
    </div>

    <!-- GRID (row do Bootstrap) — o JS preenche -->
    <div id="grid" class="row row-cols-2 row-cols-md-4 row-cols-xl-6 g-3"></div>

    <div class="text-center my-4">
      <button id="carregar" class="btn btn-grad rounded-pill px-4">Carregar mais</button>
    </div>
  </div>

  <footer class="text-center text-body-secondary small py-4 border-top">
    Feito com <strong>Bootstrap + JavaScript</strong> na aula 03 da NickDev. 💜
  </footer>

  <!-- ============================================================
       JAVASCRIPT — os componentes ganham vida (igual antes)
       ============================================================ -->
  <script>
    // ---------- 1. OS DADOS ----------
    const projetos = [
      { titulo:"Site da NickDev",   categoria:"Web",    cor:"#FBD3E4", curtidas:42 },
      { titulo:"App de Hábitos",    categoria:"Mobile", cor:"#D9CCF3", curtidas:31 },
      { titulo:"Identidade Visual", categoria:"Design", cor:"#FCE1CC", curtidas:58 },
      { titulo:"Loja Online",       categoria:"Web",    cor:"#CDEBDD", curtidas:27 },
      { titulo:"App de Receitas",   categoria:"Mobile", cor:"#CFE5FB", curtidas:19 },
      { titulo:"Poster Evento",     categoria:"Design", cor:"#F7D9C4", curtidas:44 },
    ];
    const extras = [
      { titulo:"Landing Page",    categoria:"Web",    cor:"#E4D4F7", curtidas:12 },
      { titulo:"App de Finanças", categoria:"Mobile", cor:"#D4EFE0", curtidas:22 },
      { titulo:"Kit de Ícones",   categoria:"Design", cor:"#FBE0D0", curtidas:37 },
    ];

    let filtroAtual = "Todos";
    const grid = document.querySelector("#grid");

    // ---------- 2. O COMPONENTE ----------
    // A função devolve uma COLUNA do grid com um CARD do Bootstrap.
    // As classes (col, card, card-body, badge, btn) são do Bootstrap;
    // só .cover, .tag-badge e .curtir são o nosso toque de marca.
    function criarCard(projeto) {
      const col = document.createElement("div");
      col.className = "col";
      col.innerHTML = `
        <div class="card h-100 border-0 shadow-sm">
          <div class="cover" style="background:${projeto.cor}"></div>
          <div class="card-body">
            <span class="badge rounded-pill tag-badge">${projeto.categoria}</span>
            <h3 class="card-title h6 mt-2 mb-3">${projeto.titulo}</h3>
            <button class="curtir btn btn-sm btn-outline-secondary rounded-pill">
              <span class="coracao">🤍</span> <span class="n">${projeto.curtidas}</span>
            </button>
          </div>
        </div>`;

      // interação do curtir (dentro do componente)
      const btn = col.querySelector(".curtir");
      const coracao = col.querySelector(".coracao");
      const numero = col.querySelector(".n");
      let curtido = false, total = projeto.curtidas;
      btn.addEventListener("click", () => {
        curtido = !curtido;
        total += curtido ? 1 : -1;
        numero.textContent = total;
        coracao.textContent = curtido ? "❤️" : "🤍";
        btn.classList.toggle("liked", curtido);
      });
      return col;
    }

    // ---------- 3. RENDER + FILTRO ----------
    function render(lista) {
      grid.innerHTML = "";
      lista.forEach(p => grid.appendChild(criarCard(p)));
    }
    function aplicarFiltro() {
      const lista = (filtroAtual === "Todos") ? projetos : projetos.filter(p => p.categoria === filtroAtual);
      render(lista);
    }

    // ---------- 4. FILTROS ----------
    document.querySelectorAll(".filtro").forEach(botao => {
      botao.addEventListener("click", () => {
        document.querySelectorAll(".filtro").forEach(b => b.classList.remove("active"));
        botao.classList.add("active");
        filtroAtual = botao.dataset.cat;
        aplicarFiltro();
      });
    });

    // ---------- 5. CARREGAR MAIS ----------
    document.querySelector("#carregar").addEventListener("click", (e) => {
      projetos.push(...extras);
      extras.length = 0;
      aplicarFiltro();
      e.target.style.display = "none";
    });

    // ---------- 6. TEMA (dark mode nativo do Bootstrap 5.3) ----------
    const tema = document.querySelector("#tema");
    tema.addEventListener("click", () => {
      const atual = document.documentElement.getAttribute("data-bs-theme");
      const novo = atual === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", novo);
      tema.textContent = novo === "dark" ? "☀️" : "🌙";
    });

    aplicarFiltro();
  </script>
</body>
</html>
